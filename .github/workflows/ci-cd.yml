name: CI-CD (infra -> app)

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  infra:
    name: Infra (what-if & deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Azure CLI
        uses: azure/cli@v1
      - name: Bicep what-if
        run: az deployment group what-if --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --template-file infra/main.bicep --parameters @infra/parameters.dev.json || true
      - name: Deploy infra (manual secrets required)
        if: github.ref == 'refs/heads/main'
        run: |
          az deployment group create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --template-file infra/main.bicep --parameters @infra/parameters.dev.json

  app:
    name: Build & Deploy App (canary)
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/capstone-backend:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
      - name: Deploy Container App revision (canary 10%)
        env:
          IMAGE: ${{ steps.build_and_push.outputs.IMAGE }}
        run: |
          echo "Placeholder deploy step: use az cli or GitOps to update Container App to image $IMAGE and route 10% traffic to new revision"
      - name: Smoke test
        run: |
          sleep 5
          curl -fS "https://your-app-url/health" || (echo 'smoke test failed' && exit 1)
      - name: Promote or rollback (manual decision)
        run: echo "Promotion/rollback step: automated logic should evaluate telemetry and decide"
