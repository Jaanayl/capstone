name: CI-CD

on:
  push:
    branches: [ main, feature/m5-capstone ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to ACR
        run: |
          az login --service-principal -u ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }} -p ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }} --tenant ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          az acr login --name ${{ secrets.ACR_NAME }}
      
      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/capstone-app:${{ github.sha }}
          docker build -t $IMAGE -f capstone/backend/Dockerfile .
          docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy containerapp (update image + env)
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/capstone-app:${{ github.sha }}
          az containerapp update \
            --name ${{ secrets.CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image $IMAGE \
            --set-env-vars APPINSIGHTS_CONNECTION_STRING='${{ secrets.APPINSIGHTS_CONNECTION_STRING }}'
      
      - name: Set canary traffic (10%)
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --traffic latest=10
      
      - name: Wait and run smoke tests
        run: |
          sleep 15
          CONTAINERAPP_URL=$(az containerapp show -n ${{ secrets.CONTAINERAPP_NAME }} -g ${{ secrets.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          curl -f https://${CONTAINERAPP_URL}/health || exit 1
      
      - name: Promote canary to 100%
        if: success()
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --traffic latest=100
      
      - name: Rollback on failure
        if: failure()
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --traffic latest=0
          echo "Canary deployment failed; rolled back to previous revision."
          exit 1
